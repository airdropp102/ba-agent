<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototype — Cổng tiếp nhận và xử lý bảo hành</title>
<style>body{font:15px system-ui,sans-serif;background:#f1f4f9;color:#1a2942;margin:0}header{padding:18px 30px;background:#12284c;color:white}header span{opacity:.7}main{max-width:1100px;margin:30px auto;display:grid;grid-template-columns:230px 1fr;gap:24px;padding:0 16px}.sidebar,.surface{background:white;border-radius:18px;box-shadow:0 8px 24px #172b4b13;padding:22px}.sidebar button{display:block;width:100%;text-align:left;background:white;color:#263b5a;border:1px solid #dce3ee;border-radius:9px;padding:12px;margin:7px 0;cursor:pointer}.sidebar button.active{background:#e6efff;border-color:#547be9}.screen{max-width:470px;margin:auto;min-height:420px;border:8px solid #14253e;border-radius:28px;padding:22px;background:#fff}.group{display:block;margin:14px 0}.group input,.group select,.group textarea{display:block;width:100%;box-sizing:border-box;padding:10px;border:1px solid #c4cfdf;border-radius:8px;margin-top:7px}.action{background:#3563cf;color:white;border:0;border-radius:10px;padding:11px 15px;cursor:pointer;margin:7px 7px 0 0}.muted{color:#6a7890}.card{border:1px solid #dce3ee;border-radius:12px;padding:15px;background:#f7f9fc}.badge{display:inline-block;border-radius:99px;padding:8px 12px;background:#eef3fd;margin:4px}@media(max-width:700px){main{grid-template-columns:1fr}}</style></head>
<body><header><strong>BA Studio / Prototype</strong> <span>• Wireframe demo, không kết nối backend</span></header><main><aside class="sidebar"><h3 id="project"></h3><p class="muted">Màn hình</p><nav id="nav"></nav></aside><section class="surface"><h2 id="screen-title"></h2><p id="screen-desc" class="muted"></p><div class="screen" id="screen"></div><p class="muted">Click các nút điều hướng để kiểm thử luồng. Biểu mẫu chỉ có tác dụng minh họa.</p></section></main>
<script id="payload" type="application/json">{"project":"Cổng tiếp nhận và xử lý bảo hành","screens":[{"id":"SCR-001","title":"Đăng ký bảo hành","description":"Bản phác thảo — quy tắc kiểm tra dữ liệu chờ xác nhận.","requirementIds":["FR-001"],"components":[{"type":"heading","label":"Đăng ký bảo hành","placeholder":"","value":"","options":[],"actionTarget":""},{"type":"input","label":"Số seri","placeholder":"Nhập số seri","value":"","options":[],"actionTarget":""},{"type":"input","label":"Số điện thoại","placeholder":"Nhập số điện thoại","value":"","options":[],"actionTarget":""},{"type":"button","label":"Gửi yêu cầu (minh họa)","placeholder":"","value":"","options":[],"actionTarget":""},{"type":"button","label":"Đến danh sách yêu cầu","placeholder":"","value":"","options":[],"actionTarget":"SCR-002"}]},{"id":"SCR-002","title":"Danh sách bảo hành","description":"Minh họa giao diện nhân viên trạm — chưa có dữ liệu thật.","requirementIds":["FR-002"],"components":[{"type":"heading","label":"Yêu cầu bảo hành","placeholder":"","value":"","options":[],"actionTarget":""},{"type":"card","label":"Phiếu demo #001 — Tiếp nhận","placeholder":"","value":"","options":[],"actionTarget":""},{"type":"select","label":"Trạng thái (minh họa)","placeholder":"","value":"","options":["Tiếp nhận","Đang xử lý","Hoàn thành"],"actionTarget":""},{"type":"button","label":"Đến báo cáo","placeholder":"","value":"","options":[],"actionTarget":"SCR-003"},{"type":"button","label":"Về đăng ký","placeholder":"","value":"","options":[],"actionTarget":"SCR-001"}]},{"id":"SCR-003","title":"Báo cáo","description":"Chỉ hiển thị dữ liệu mẫu, chưa kết nối hệ thống.","requirementIds":["FR-003"],"components":[{"type":"heading","label":"Báo cáo số phiếu theo trạng thái","placeholder":"","value":"","options":[],"actionTarget":""},{"type":"badge","label":"Tiếp nhận: 3 (demo)","placeholder":"","value":"","options":[],"actionTarget":""},{"type":"badge","label":"Đang xử lý: 2 (demo)","placeholder":"","value":"","options":[],"actionTarget":""},{"type":"badge","label":"Hoàn thành: 7 (demo)","placeholder":"","value":"","options":[],"actionTarget":""},{"type":"button","label":"Về danh sách","placeholder":"","value":"","options":[],"actionTarget":"SCR-002"}]}]}</script>
<script>
const data=JSON.parse(document.getElementById('payload').textContent);document.getElementById('project').textContent=data.project;
const screens=data.screens;let active=screens[0]?.id;
function node(tag,text,css){const e=document.createElement(tag);if(text)e.textContent=text;if(css)e.className=css;return e}
function show(id){const s=screens.find(x=>x.id===id);if(!s)return;active=id;document.getElementById('screen-title').textContent=s.title;document.getElementById('screen-desc').textContent=s.description;const nav=document.getElementById('nav');nav.replaceChildren();for(const x of screens){const b=node('button',x.title,x.id===id?'active':'');b.onclick=()=>show(x.id);nav.append(b)}const view=document.getElementById('screen');view.replaceChildren();for(const c of s.components){let e;switch(c.type){case 'heading':e=node('h3',c.label);break;case 'paragraph':e=node('p',c.label);break;case 'card':e=node('div',c.label,'card group');break;case 'badge':e=node('span',c.label,'badge');break;case 'button':e=node('button',c.label,'action');e.onclick=()=>{if(c.actionTarget)show(c.actionTarget);else alert('Minh họa giao diện: chức năng thực tế chưa triển khai')};break;case 'input':case 'textarea':case 'select':{e=node('label',c.label,'group');let f;if(c.type==='textarea')f=document.createElement('textarea');else if(c.type==='select'){f=document.createElement('select');for(const o of c.options){const opt=node('option',o);opt.value=o;f.append(opt)}}else{f=document.createElement('input');f.type='text'}f.placeholder=c.placeholder||'';f.value=c.value||'';e.append(f);break}default:e=node('p',c.label)}view.append(e)}}if(screens.length)show(active);else document.getElementById('screen').textContent='Chưa có màn hình.';
</script></body></html>
